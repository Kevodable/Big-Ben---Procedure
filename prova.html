<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>prova — Big Ben</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--border:#e2ddd8;--text:#1a1714;--text2:#6b6560;--text3:#a09890;--accent:#c8392b;--green:#2a7a4b;--green-light:#edf7f2;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--text);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:26px;height:26px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;font-family:'DM Mono',monospace;}
.logo-text{font-size:13px;font-weight:500;color:#fff;}
.back-btn{font-size:12px;color:#666;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;}
.back-btn:hover{color:#fff;}
.container{max-width:660px;margin:0 auto;padding:36px 24px 80px;}
.proc-icon-big{font-size:44px;margin-bottom:12px;display:block;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.badge.attiva{background:var(--green-light);color:var(--green);}
.badge.bozza{background:#f0ede8;color:var(--text3);}
.proc-title{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.2;margin-bottom:6px;}
.proc-cat{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;font-family:'DM Mono',monospace;}
.proc-desc{font-size:15px;color:var(--text2);line-height:1.6;}
.divider{height:1px;background:var(--border);margin:24px 0;}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px;}
.prog-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
.prog-label span:last-child{font-weight:600;font-family:'DM Mono',monospace;color:var(--green);}
.prog-bg{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:24px;}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s ease;}
.step-row{display:flex;gap:14px;margin-bottom:10px;cursor:pointer;user-select:none;}
.step-circle{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text3);flex-shrink:0;transition:all .2s;font-family:'DM Mono',monospace;margin-top:2px;}
.step-row.done .step-circle{background:var(--green);border-color:var(--green);color:#fff;}
.step-row.done .step-circle::after{content:'\2713';}
.step-row.done .step-circle span{display:none;}
.step-body{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;flex:1;transition:all .15s;}
.step-row:hover .step-body{border-color:#c8b8b0;}
.step-row.done .step-body{background:var(--green-light);border-color:#b8dfc9;}
.step-text{font-size:15px;line-height:1.5;}
.step-row.done .step-text{color:var(--text2);text-decoration:line-through;text-decoration-color:#a0c8b0;}
.step-media{margin-top:10px;}
.step-media img{max-width:100%;border-radius:8px;border:1px solid var(--border);display:block;}
.step-media iframe{width:100%;aspect-ratio:16/9;border-radius:8px;border:none;display:block;}
.complete{background:var(--green);color:#fff;border-radius:14px;padding:20px 24px;text-align:center;margin-top:24px;display:none;}
.ci{font-size:30px;margin-bottom:8px;}.ct{font-size:17px;font-weight:600;margin-bottom:4px;}.cs{font-size:13px;opacity:.8;}
.btn-reset{margin-top:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.notes{background:#fff8e8;border:1px solid #f0e0a0;border-radius:12px;padding:15px 17px;margin-top:24px;}
.notes-label{font-size:11px;font-weight:600;color:#a08030;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.notes-text{font-size:14px;color:#806020;line-height:1.6;}
</style>
</head>
<body>
<header><div class="logo"><div class="logo-mark">BB</div><div class="logo-text">Big Ben</div></div><button class="back-btn" onclick="history.back()">&#8592; Indietro</button></header>
<div class="container">
<span class="proc-icon-big">📋</span>
<div class="badge attiva">&#9679; Attiva</div>
<h1 class="proc-title">prova</h1>
<div class="proc-cat">Generale</div>
<div class="proc-desc">prova</div>
<div class="divider"></div><div class="prog-label"><span>Avanzamento</span><span id="pct">0/1 (0%)</span></div><div class="prog-bg"><div class="prog-fill" id="bar" style="width:0%"></div></div><div class="section-label">Passaggi</div>
    <div class="step-row" onclick="toggle(0)" id="s0">
      <div class="step-circle"><span>1</span></div>
      <div class="step-body">
        <div class="step-text">prova</div>
        <div class="step-media"><img src="https://imgur.com/a/GP9Msr2" alt="" loading="lazy" onerror="this.closest('.step-media').style.display='none'"></div>
      </div>
    </div><div class="complete" id="done-banner"><div class="ci">&#127881;</div><div class="ct">Procedura completata!</div><div class="cs">Tutti i passaggi eseguiti.</div><button class="btn-reset" onclick="resetAll()">&#8635; Ricomincia</button></div>
</div>
<script>
var done=new Set(),total=1;
function update(){
  var pct=total?Math.round(done.size/total*100):0;
  var bar=document.getElementById("bar"),lbl=document.getElementById("pct"),banner=document.getElementById("done-banner");
  if(bar)bar.style.width=pct+"%";
  if(lbl)lbl.textContent=done.size+"/"+total+" ("+pct+"%)";
  if(banner)banner.style.display=(done.size===total&&total>0)?"block":"none";
  for(var i=0;i<total;i++){var el=document.getElementById("s"+i);if(el)el.className="step-row"+(done.has(i)?" done":"");}
}
function toggle(i){if(done.has(i))done.delete(i);else done.add(i);update();}
function resetAll(){done.clear();update();}
</script>
</body>
</html>
