<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedura — Big Ben</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --border: #e2ddd8;
  --text: #1a1714;
  --text2: #6b6560;
  --text3: #a09890;
  --accent: #c8392b;
  --accent-light: #fdf0ee;
  --green: #2a7a4b;
  --green-light: #edf7f2;
  --green-dark: #1e5e38;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: var(--text);
  padding: 0 32px;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 26px; height: 26px; background: var(--accent);
  border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  font-family: 'DM Mono', monospace;
}
.logo-text { font-size: 13px; font-weight: 500; color: #fff; }
.back-btn {
  font-size: 12px; color: #666; background: none; border: none;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; gap: 4px;
}
.back-btn:hover { color: #fff; }

.container { max-width: 680px; margin: 0 auto; padding: 40px 24px 80px; }

/* META */
.proc-meta { margin-bottom: 32px; }
.proc-icon-big { font-size: 48px; margin-bottom: 14px; display: block; }
.proc-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
}
.proc-badge.attiva { background: var(--green-light); color: var(--green); }
.proc-badge.bozza { background: #f0ede8; color: var(--text3); }
.proc-title { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 6px; }
.proc-category { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 14px; font-family: 'DM Mono', monospace; }
.proc-description { font-size: 15px; color: var(--text2); line-height: 1.6; }

/* DIVIDER */
.divider { height: 1px; background: var(--border); margin: 28px 0; }

/* STEPS */
.steps-heading {
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
}

.step-row {
  display: flex; gap: 16px; margin-bottom: 12px;
  cursor: pointer; user-select: none;
}
.step-row:last-child { margin-bottom: 0; }

.step-circle {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--text3);
  flex-shrink: 0; transition: all 0.2s;
  font-family: 'DM Mono', monospace;
}
.step-row.done .step-circle {
  background: var(--green); border-color: var(--green); color: #fff;
}
.step-row.done .step-circle::after { content: '✓'; }
.step-row.done .step-circle span { display: none; }

.step-body {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 18px; flex: 1;
  transition: all 0.15s;
}
.step-row:hover .step-body { border-color: #c8b8b0; }
.step-row.done .step-body {
  background: var(--green-light); border-color: #b8dfc9;
}
.step-text { font-size: 15px; line-height: 1.5; transition: color 0.15s; }
.step-row.done .step-text { color: var(--text2); text-decoration: line-through; text-decoration-color: #a0c8b0; }

/* PROGRESS */
.progress-wrap { margin-bottom: 28px; }
.progress-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; margin-bottom: 8px;
}
.progress-label span:first-child { color: var(--text2); }
.progress-label span:last-child { font-weight: 600; font-family: 'DM Mono', monospace; color: var(--green); }
.progress-bar-bg { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.3s ease; }

/* COMPLETE BANNER */
.complete-banner {
  background: var(--green); color: #fff; border-radius: 14px;
  padding: 20px 24px; text-align: center; margin-top: 28px;
  display: none;
}
.complete-banner .cb-icon { font-size: 32px; margin-bottom: 8px; }
.complete-banner .cb-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.complete-banner .cb-sub { font-size: 13px; opacity: 0.8; }
.btn-reset {
  margin-top: 14px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
  color: #fff; padding: 8px 18px; border-radius: 8px; font-size: 13px;
  cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500;
}
.btn-reset:hover { background: rgba(255,255,255,0.3); }

/* NOTES */
.notes-box {
  background: #fff8e8; border: 1px solid #f0e0a0; border-radius: 12px;
  padding: 16px 18px; margin-top: 28px;
}
.notes-label { font-size: 11px; font-weight: 600; color: #a08030; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.notes-text { font-size: 14px; color: #806020; line-height: 1.6; }

/* NOT FOUND */
.not-found { text-align: center; padding: 80px 24px; color: var(--text3); }
.not-found .nf-icon { font-size: 56px; margin-bottom: 16px; }
.not-found h2 { font-size: 20px; color: var(--text2); margin-bottom: 8px; }
.not-found p { font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">BB</div>
    <div class="logo-text">Big Ben</div>
  </div>
  <button class="back-btn" onclick="history.back()">← Indietro</button>
</header>

<div class="container" id="content">
  <div class="not-found">
    <div class="nf-icon">⏳</div>
    <h2>Caricamento...</h2>
  </div>
</div>

<script>
const STORAGE_KEY = 'bigben_procedures';

function loadProc() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { showNotFound(); return; }

  let procedures = [];
  try { procedures = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}

  const p = procedures.find(x => x.id === id);
  if (!p) { showNotFound(id); return; }

  renderProc(p);
}

function renderProc(p) {
  const steps = p.steps || [];
  const doneKey = `done_${p.id}`;
  let done = new Set();
  try { done = new Set(JSON.parse(sessionStorage.getItem(doneKey) || '[]')); } catch(e) {}

  function saveDone() { sessionStorage.setItem(doneKey, JSON.stringify([...done])); }
  function pct() { return steps.length ? Math.round(done.size / steps.length * 100) : 0; }

  function render() {
    const completed = done.size === steps.length && steps.length > 0;
    document.getElementById('content').innerHTML = `
      <div class="proc-meta">
        <span class="proc-icon-big">${p.icon || '📋'}</span>
        <div class="proc-badge ${p.status}">${p.status === 'attiva' ? '● Attiva' : '● Bozza'}</div>
        <h1 class="proc-title">${esc(p.name)}</h1>
        <div class="proc-category">${esc(p.category || 'Generale')}</div>
        ${p.description ? `<div class="proc-description">${esc(p.description)}</div>` : ''}
      </div>

      ${steps.length > 0 ? `
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Avanzamento</span>
          <span>${done.size}/${steps.length} (${pct()}%)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${pct()}%"></div>
        </div>
      </div>

      <div class="divider"></div>
      <div class="steps-heading">Passaggi</div>
      <div id="steps-container">
        ${steps.map((s, i) => `
          <div class="step-row ${done.has(i) ? 'done' : ''}" onclick="toggleStep(${i})" id="step-${i}">
            <div class="step-circle"><span>${i+1}</span></div>
            <div class="step-body">
              <div class="step-text">${esc(s)}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="complete-banner" id="complete-banner" style="${completed ? 'display:block' : 'display:none'}">
        <div class="cb-icon">🎉</div>
        <div class="cb-title">Procedura completata!</div>
        <div class="cb-sub">Tutti i passaggi sono stati eseguiti.</div>
        <button class="btn-reset" onclick="resetAll()">↺ Ricomincia</button>
      </div>
      ` : '<p style="color:var(--text3);font-size:14px">Nessun passaggio definito per questa procedura.</p>'}

      ${p.notes ? `
      <div class="notes-box">
        <div class="notes-label">⚠️ Note</div>
        <div class="notes-text">${esc(p.notes)}</div>
      </div>` : ''}
    `;

    // Bind events
    window.toggleStep = (i) => {
      if (done.has(i)) done.delete(i); else done.add(i);
      saveDone();
      render();
    };
    window.resetAll = () => {
      done.clear(); saveDone(); render();
    };
  }

  render();
}

function showNotFound(id) {
  document.getElementById('content').innerHTML = `
    <div class="not-found">
      <div class="nf-icon">🔍</div>
      <h2>Procedura non trovata</h2>
      <p>Questa procedura non esiste o è stata eliminata.<br>
      ${id ? `<small style="font-family:monospace;color:#bbb">ID: ${esc(id)}</small>` : ''}
      </p>
    </div>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

loadProc();
</script>
</body>
</html>
